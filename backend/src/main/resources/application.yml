server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always

spring:
  application:
    name: campusconnect-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campusconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:campus_app}
    password: ${DB_PASSWORD:change_this_password}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-key-change-this-before-deploying-123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  ai:
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    embedding-model: ${AI_EMBEDDING_MODEL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
